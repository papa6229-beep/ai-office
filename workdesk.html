<section id="work">
  <header class="work-heading">
    <div><p id="workDate" class="work-muted"></p><h2>오늘, 어떤 일을 도와드릴까요?</h2><p class="work-muted">업무를 남기고, 진행을 이어가고, 하루를 정리하세요.</p></div>
    <div class="work-links"><button type="button" class="work-quiet" data-work-action="reload">새로고침</button><button type="button" class="work-quiet" data-work-action="desk">내 자료 열기</button><button type="button" class="work-quiet" data-work-action="tasks">기존 업무 리스트</button></div>
  </header>
  <div id="workNotice" class="work-notice" role="status" aria-live="polite" hidden></div>
  <div id="workRetry" class="work-retry" hidden><span>응답을 확인하지 못했습니다. 같은 요청으로 다시 확인할 수 있습니다.</span><button type="button" data-work-action="retry">같은 요청 다시 시도</button></div>
  <div class="work-layout">
    <div class="work-main">
      <article class="work-assistant" aria-labelledby="workAssistantTitle">
        <div class="work-panel-heading"><h3 id="workAssistantTitle">나의 업무 비서</h3><span id="workConnection" class="work-muted">연결 확인 중</span></div>
        <div id="workMessages" class="work-messages" role="log" aria-label="업무 비서 대화" aria-live="polite"><p class="work-empty">업무와 대화를 불러오고 있습니다.</p></div>
        <form id="workCommandForm">
          <div class="work-context"><span id="workContext">새 업무 또는 오늘 전체 업무에 대해 이야기합니다.</span><button type="button" id="workClearContext" class="work-text-button" data-work-action="clear-context" hidden>선택 해제</button></div>
          <label class="work-sr-only" for="workCommand">업무 요청</label><textarea id="workCommand" rows="3" maxlength="6000" placeholder="해야 할 일이나 업무 진행 내용을 알려주세요." required></textarea>
          <div class="work-compose-footer"><span>업무 등록 · 진행 기록 · 오늘 보고서</span><button type="submit" id="workSend">요청 보내기</button></div>
        </form>
        <div class="work-examples" aria-label="요청 예시"><span>이렇게 요청해 보세요</span><button type="button" data-work-example="내일까지 행사 시안 준비를 업무로 등록해줘">내일까지 행사 시안 준비를 업무로 등록해줘</button><button type="button" data-work-example="오늘 업무 보고서 작성해줘">오늘 업무 보고서 작성해줘</button></div>
      </article>
      <article class="work-tasks" aria-labelledby="workTasksTitle">
        <div class="work-panel-heading"><div><h3 id="workTasksTitle">오늘의 업무</h3><p id="workCounts" class="work-muted"></p></div><button type="button" data-work-action="add-task" class="work-secondary">+ 업무 추가</button></div>
        <form id="workTaskForm" class="work-task-form" hidden>
          <label for="workTaskTitle">업무 이름</label><input id="workTaskTitle" maxlength="300" required placeholder="해야 할 일">
          <label for="workTaskDetail">내용 <span class="work-muted">선택</span></label><textarea id="workTaskDetail" rows="2" maxlength="6000"></textarea>
          <label for="workTaskDue">마감일 <span class="work-muted">선택</span></label><input id="workTaskDue" type="date">
          <div class="work-form-actions"><button type="button" class="work-quiet" data-work-action="cancel-task">취소</button><button type="submit">업무 저장</button></div>
        </form>
        <div id="workTaskList" class="work-task-list"><p class="work-empty">업무를 불러오고 있습니다.</p></div>
      </article>
    </div>
    <aside class="work-rail">
      <article class="work-detail" aria-labelledby="workDetailTitle"><h3 id="workDetailTitle">선택한 업무</h3><div id="workTaskDetailPanel"><p class="work-empty">업무를 선택하면 진행 상태, 메모, 연결 자료를 볼 수 있습니다.</p></div></article>
      <article class="work-report" aria-labelledby="workReportTitle"><div class="work-panel-heading"><h3 id="workReportTitle">오늘의 보고서</h3><button type="button" class="work-secondary" data-work-action="report">보고서 작성</button></div><p id="workReportMeta" class="work-muted">저장된 보고서를 불러오고 있습니다.</p><pre id="workReportBody" hidden></pre><div id="workReportActions" class="work-report-actions" hidden><button type="button" class="work-quiet" data-work-action="copy-report">복사</button><button type="button" class="work-quiet" data-work-action="download-report">텍스트 저장</button></div></article>
    </aside>
  </div>
</section>
